<!doctype html>
<!-- Authored by Claude Sonnet 5.5 (Anthropic), with Steven Chock as co-author. Added after iteration 1; see README.MD. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preparation progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.sweep{animation:sweep 1.8s infinite ease-in-out}
@media (prefers-reduced-motion: reduce){.sweep{animation:none;transform:none;width:100%}}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #16202A">
<sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
<section aria-label="Interview preparation progress" style="position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E1E5EA; padding: 16px; box-sizing: border-box">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px">
<span id="prep-label" style="font-weight: 600; color: #16202A">{{label}}</span>
<span style="color: #4A5562">{{note}}</span>
</div>
<div role="progressbar" aria-labelledby="prep-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{now}}" aria-valuetext="{{label}}" style="height: 12px; border-radius: 6px; background: #D5DAE0; overflow: hidden; position: relative">
<sc-if value="{{determinate}}" hint-placeholder-val="{{ true }}">
<div style="width: {{width}}; height: 100%; background: {{color}}; border-radius: 6px"></div>
</sc-if>
<sc-if value="{{indeterminate}}" hint-placeholder-val="{{ false }}">
<div class="sweep" style="width: 40%; height: 100%; background: #9A4D00; border-radius: 6px"></div>
</sc-if>
</div>
</div>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["preparing","retrying","diagnosing","ready","hidden"],"default":"preparing","section":"Progress"},"percent":{"editor":"range","min":0,"max":100,"step":1,"default":45,"section":"Progress"},"note":{"editor":"text","default":"","section":"Progress"},"$preview":{"width":1200,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const state = p.state ?? 'preparing';
    const pct = state === 'ready' ? 100 : Math.max(0, Math.min(100, Number(p.percent ?? 45)));
    const table = {
      preparing: { label: 'Preparing your interview', note: pct + '%', color: '#1D4ED8', indet: false },
      retrying: { label: 'Preparing your interview', note: 'Taking longer than usual. Retrying', color: '#9A4D00', indet: false },
      diagnosing: { label: 'Preparing your interview', note: 'Checking what went wrong', color: '#9A4D00', indet: true },
      ready: { label: 'Your interview is ready', note: '', color: '#0F6B5C', indet: false }
    };
    const t = table[state];
    const show = !!t;
    const note = show ? ((p.note ?? '') !== '' ? p.note : t.note) : '';
    return {
      show: show,
      label: show ? t.label : '',
      note: note,
      now: pct,
      width: pct + '%',
      color: show ? t.color : '#1D4ED8',
      determinate: show && !t.indet,
      indeterminate: show && t.indet
    };
  }
}
</script>
</body>
</html>
